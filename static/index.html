<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>영업팀 에이전트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --marketing:    #0891b2;
      --crm:          #059669;
      --performance:  #d97706;
      --onboarding:   #2563eb;
      --communication:#7c3aed;
      --auto:         #4b5563;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: white;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .header-icon { font-size: 22px; }
    .header-text h1 { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
    .header-text p  { font-size: 11px; opacity: .75; margin-top: 1px; }
    .reset-btn {
      margin-left: auto;
      background: rgba(255,255,255,.2);
      border: none; color: white;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background .2s;
    }
    .reset-btn:hover { background: rgba(255,255,255,.35); }

    /* ── Agent tabs ──────────────────────── */
    .tabs-wrap {
      background: white;
      padding: 8px 10px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 6px 13px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      transition: all .18s;
      white-space: nowrap;
    }
    .tab:hover { border-color: #94a3b8; color: #374151; }
    .tab.active { color: white; border-color: transparent; }

    .tab[data-key="auto"].active         { background: var(--auto); }
    .tab[data-key="marketing"].active    { background: var(--marketing); }
    .tab[data-key="customer_management"].active { background: var(--crm); }
    .tab[data-key="performance"].active  { background: var(--performance); }
    .tab[data-key="onboarding"].active   { background: var(--onboarding); }
    .tab[data-key="communication"].active{ background: var(--communication); }

    /* ── Chat area ───────────────────────── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 16px;
      color: #6b7280;
    }
    .welcome .logo { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-size: 17px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .welcome p  { font-size: 13px; line-height: 1.7; max-width: 300px; }
    .quick-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
    .quick {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1.5px solid #e5e7eb;
      background: white;
      font-size: 12px;
      cursor: pointer;
      color: #374151;
      transition: all .18s;
    }
    .quick:hover { border-color: #2563eb; color: #2563eb; }

    /* Message row */
    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      background: #e5e7eb;
    }
    .msg-row.user .avatar { background: #2563eb; }

    .bubble-wrap { display: flex; flex-direction: column; max-width: calc(100% - 46px); }
    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .agent-label {
      font-size: 10px;
      color: #9ca3af;
      margin-bottom: 3px;
      padding-left: 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-row.agent .bubble {
      background: white;
      color: #1f2937;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* agent bubble accent color */
    .bubble[data-agent="marketing"]           { border-left: 3px solid var(--marketing); }
    .bubble[data-agent="customer_management"] { border-left: 3px solid var(--crm); }
    .bubble[data-agent="performance"]         { border-left: 3px solid var(--performance); }
    .bubble[data-agent="onboarding"]          { border-left: 3px solid var(--onboarding); }
    .bubble[data-agent="communication"]       { border-left: 3px solid var(--communication); }

    /* Typing indicator */
    .typing-row { display: flex; gap: 8px; align-items: flex-end; }
    .typing {
      background: white;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex; gap: 5px; align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* ── Input bar ───────────────────────── */
    .input-bar {
      background: white;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .input-bar textarea {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 22px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 110px;
      font-family: inherit;
      line-height: 1.45;
      transition: border-color .2s;
      overflow-y: auto;
    }
    .input-bar textarea:focus { border-color: #2563eb; }
    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .18s;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: #1d4ed8; }
    .send-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-icon">🤖</div>
  <div class="header-text">
    <h1>영업팀 에이전트</h1>
    <p>Marketing · CRM · 실적 · 온보딩 · 커뮤니케이션</p>
  </div>
  <button class="reset-btn" onclick="resetChat()">초기화</button>
</div>

<!-- Agent tabs -->
<div class="tabs-wrap">
  <button class="tab active" data-key="auto"                onclick="selectTab(this)">🔀 자동</button>
  <button class="tab"        data-key="marketing"           onclick="selectTab(this)">📊 마케팅</button>
  <button class="tab"        data-key="customer_management" onclick="selectTab(this)">👥 고객관리</button>
  <button class="tab"        data-key="performance"         onclick="selectTab(this)">📈 실적관리</button>
  <button class="tab"        data-key="onboarding"          onclick="selectTab(this)">🎓 온보딩</button>
  <button class="tab"        data-key="communication"       onclick="selectTab(this)">💬 커뮤니케이션</button>
</div>

<!-- Chat -->
<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="logo">🏢</div>
    <h2>영업팀 에이전트 시스템</h2>
    <p>무엇이든 물어보세요.<br/>자동으로 맞는 에이전트가 처리합니다.</p>
    <div class="quick-wrap">
      <button class="quick" onclick="send('팀원 등록해줘. 이름: 김민수, 역할: sales_rep')">👤 팀원 등록</button>
      <button class="quick" onclick="send('리드점수 높은 고객 DB 조회해줘')">📋 고객 DB 조회</button>
      <button class="quick" onclick="send('팀 전체 실적 대시보드 보여줘')">📊 실적 대시보드</button>
      <button class="quick" onclick="send('고객 DB를 팀원들에게 배포해줘')">📤 고객 배포</button>
      <button class="quick" onclick="send('신규 팀원 온보딩 플랜 만들어줘')">🎓 온보딩 플랜</button>
      <button class="quick" onclick="send('팀 전체에 공지사항 보내줘')">📢 팀 공지</button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-bar">
  <textarea
    id="input"
    rows="1"
    placeholder="메시지를 입력하세요..."
    onkeydown="handleKey(event)"
    oninput="autoResize(this)"
  ></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendFromInput()">➤</button>
</div>

<script>
  let selectedAgent = 'auto';
  let isLoading = false;

  const AGENT_ICONS = {
    marketing: '📊', customer_management: '👥',
    performance: '📈', onboarding: '🎓',
    communication: '💬', auto: '🤖'
  };
  const AGENT_NAMES = {
    marketing: '마케팅 에이전트',
    customer_management: '고객관리 에이전트',
    performance: '실적관리 에이전트',
    onboarding: '온보딩 에이전트',
    communication: '팀 커뮤니케이션 에이전트',
    auto: '에이전트'
  };

  function selectTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    selectedAgent = el.dataset.key;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendFromInput();
    }
  }

  function sendFromInput() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || isLoading) return;
    input.value = '';
    input.style.height = 'auto';
    send(text);
  }

  async function send(text) {
    if (isLoading) return;

    hideWelcome();
    appendUser(text);
    setLoading(true);
    const typingEl = appendTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, agent: selectedAgent })
      });
      const data = await res.json();
      typingEl.remove();
      appendAgent(data.response, data.agent, data.agent_description);
    } catch (err) {
      typingEl.remove();
      appendAgent('오류가 발생했습니다. 서버 연결을 확인해주세요.', 'auto', '시스템');
    } finally {
      setLoading(false);
    }
  }

  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function appendUser(text) {
    const chat = document.getElementById('chat');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="avatar">😊</div>
      <div class="bubble-wrap">
        <div class="bubble">${escHtml(text)}</div>
      </div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendAgent(text, agentKey, agentDesc) {
    const chat = document.getElementById('chat');
    const icon = AGENT_ICONS[agentKey] || '🤖';
    const name = agentDesc || AGENT_NAMES[agentKey] || '에이전트';
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="avatar">${icon}</div>
      <div class="bubble-wrap">
        <div class="agent-label">${escHtml(name)}</div>
        <div class="bubble" data-agent="${agentKey}">${formatText(text)}</div>
      </div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendTyping() {
    const chat = document.getElementById('chat');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(row);
    scrollBottom();
    return row;
  }

  function setLoading(on) {
    isLoading = on;
    document.getElementById('sendBtn').disabled = on;
    document.getElementById('input').disabled = on;
  }

  function scrollBottom() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  }

  async function resetChat() {
    if (!confirm('대화 이력을 초기화할까요?')) return;
    await fetch('/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: null })
    });
    const chat = document.getElementById('chat');
    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="logo">🏢</div>
        <h2>영업팀 에이전트 시스템</h2>
        <p>무엇이든 물어보세요.<br/>자동으로 맞는 에이전트가 처리합니다.</p>
        <div class="quick-wrap">
          <button class="quick" onclick="send('팀원 등록해줘. 이름: 김민수, 역할: sales_rep')">👤 팀원 등록</button>
          <button class="quick" onclick="send('리드점수 높은 고객 DB 조회해줘')">📋 고객 DB 조회</button>
          <button class="quick" onclick="send('팀 전체 실적 대시보드 보여줘')">📊 실적 대시보드</button>
          <button class="quick" onclick="send('고객 DB를 팀원들에게 배포해줘')">📤 고객 배포</button>
          <button class="quick" onclick="send('신규 팀원 온보딩 플랜 만들어줘')">🎓 온보딩 플랜</button>
          <button class="quick" onclick="send('팀 전체에 공지사항 보내줘')">📢 팀 공지</button>
        </div>
      </div>`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatText(str) {
    return escHtml(str)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code style="background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:13px">$1</code>');
  }
</script>
</body>
</html>
